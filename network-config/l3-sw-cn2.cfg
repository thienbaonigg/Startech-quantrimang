!
! STARTECH - L3 Switch Chi nhánh 2 (L3-SW-CN2)
! Cisco IOSvL2 / Catalyst 3650 - Config cho GNS3
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname L3-SW-CN2
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip routing
ip cef
!
ip domain name startech.local
ip name-server 192.168.10.11
ip name-server 192.168.110.11
!
vtp domain STARTECH
vtp mode transparent
!
spanning-tree mode rapid-pvst
spanning-tree vlan 110,120,140 priority 0
!
vlan internal allocation policy ascending
!
redundancy
 mode sso
!
interface GigabitEthernet1/0/1
 description *** Uplink to R-CN2 (Trunk) ***
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 110,120,140
 spanning-tree portfast trunk
!
interface GigabitEthernet1/0/2
 description *** Downlink to L2-SW-CN2-1 (Trunk) ***
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 110,120,140
 spanning-tree portfast trunk
!
interface GigabitEthernet1/0/3
 description *** Downlink to L2-SW-CN2-2 (Trunk) ***
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 110,120,140
 spanning-tree portfast trunk
!
interface GigabitEthernet1/0/4
 description *** Server03 - DC2/DNS ***
 switchport access vlan 110
 switchport mode access
 spanning-tree portfast
 authentication port-control auto
 dot1x pae authenticator
!
interface GigabitEthernet1/0/5
 description *** WiFi AP CN2 (Guest) ***
 switchport access vlan 140
 switchport mode access
 spanning-tree portfast
!
interface Vlan110
 description *** SVI VLAN 110 - Server/Mgmt CN2 ***
 ip address 192.168.110.2 255.255.255.0
 ip helper-address 192.168.10.12
 no shutdown
!
interface Vlan120
 description *** SVI VLAN 120 - Sales/CS CN2 ***
 ip address 192.168.120.2 255.255.255.0
 ip helper-address 192.168.10.12
 no shutdown
!
interface Vlan140
 description *** SVI VLAN 140 - Guest WiFi CN2 ***
 ip address 192.168.140.2 255.255.255.0
 ip helper-address 192.168.10.12
 no shutdown
!
router ospf 1
 router-id 10.10.10.2
 network 192.168.110.0 0.0.0.255 area 0
 network 192.168.120.0 0.0.0.255 area 0
 network 192.168.140.0 0.0.0.255 area 0
 passive-interface Vlan140
!
ip forward-protocol nd
!
no ip http server
ip http secure-server
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 exec-timeout 0 0
 password cisco123
 login local
 transport input ssh
!
end