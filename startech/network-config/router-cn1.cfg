!
! STARTECH - Router Chi nhánh 1 (R-CN1)
! Cisco IOSv 15.9(3)M - Config cho GNS3
!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R-CN1
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
no ipv6 cef
!
ip domain name startech.local
ip name-server 192.168.10.11
ip name-server 192.168.110.11
!
subscriber templating
!
multilink bundle-name authenticated
!
cts logging verbose
!
license udi pid ISR4331/K9 sn FDO12345678
!
spanning-tree extend system-id
!
vlan internal allocation policy ascending
!
redundancy
 mode none
!
interface GigabitEthernet0/0
 description *** WAN - Connect to Firewall/Internet ***
 ip address dhcp
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet0/1
 description *** Trunk to L3-SW-CN1 ***
 no ip address
 negotiation auto
!
interface GigabitEthernet0/1.10
 description *** VLAN 10 - Server/Mgmt CN1 ***
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip helper-address 192.168.10.12
!
interface GigabitEthernet0/1.20
 description *** VLAN 20 - Sales CN1 ***
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip helper-address 192.168.10.12
!
interface GigabitEthernet0/1.30
 description *** VLAN 30 - Acct/HR CN1 ***
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip helper-address 192.168.10.12
!
interface GigabitEthernet0/1.40
 description *** VLAN 40 - Guest WiFi CN1 ***
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
 ip helper-address 192.168.10.12
!
interface GigabitEthernet0/2
 description *** WAN Link to R-CN2 (10.0.0.0/30) ***
 ip address 10.0.0.1 255.255.255.252
 negotiation auto
!
router ospf 1
 router-id 1.1.1.1
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
 network 10.0.0.0 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/0
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
line aux 0
line vty 0 4
 exec-timeout 0 0
 password cisco123
 login local
 transport input ssh
!
end