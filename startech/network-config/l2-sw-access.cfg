!
! STARTECH - L2 Access Switch Template (Cisco Catalyst 2960)
! Áp dụng cho: L2-SW-CN1-1, L2-SW-CN1-2, L2-SW-CN2-1, L2-SW-CN2-2
! Thay đổi hostname, VLAN theo chi nhánh
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname L2-SW-ACCESS
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
vtp domain STARTECH
vtp mode client
!
spanning-tree mode rapid-pvst
!
vlan internal allocation policy ascending
!
! ============================================================
! TRUNK UPLINK TO L3 SWITCH
! ============================================================
interface GigabitEthernet1/0/1
 description *** Uplink to L3 Switch (Trunk) ***
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40   ! CN1: 10,20,30,40 | CN2: 110,120,140
 spanning-tree portfast trunk
!
! ============================================================
! ACCESS PORTS - ĐIỀN THEO PHÒNG BAN
! ============================================================
! Ví dụ phòng Kinh doanh (VLAN 20/120) - cổng 2-10
interface range GigabitEthernet1/0/2 - 10
 description *** Phong Kinh doanh ***
 switchport access vlan 20        ! CN1: 20 | CN2: 120
 switchport mode access
 spanning-tree portfast
 authentication port-control auto
 dot1x pae authenticator
!
! Ví dụ phòng Kế toán/NHân sự (VLAN 30) - cổng 11-18
interface range GigabitEthernet1/0/11 - 18
 description *** Phong Ke toan / Nhan su ***
 switchport access vlan 30        ! CN1: 30 | CN2: N/A (hợp nhất vào 120)
 switchport mode access
 spanning-tree portfast
 authentication port-control auto
 dot1x pae authenticator
!
! Ví dụ phòng Kỹ thuật/Server (VLAN 10/110) - cổng 19-20
interface range GigabitEthernet1/0/19 - 20
 description *** Phong Ky thuat / Server ***
 switchport access vlan 10        ! CN1: 10 | CN2: 110
 switchport mode access
 spanning-tree portfast
 authentication port-control auto
 dot1x pae authenticator
!
! Cổng dành cho máy in, thiết bị IoT - VLAN riêng nếu cần
interface range GigabitEthernet1/0/21 - 24
 description *** Printers / IoT ***
 switchport access vlan 20        ! Điều chỉnh theo VLAN phù hợp
 switchport mode access
 spanning-tree portfast
!
! ============================================================
! PORT SECURITY (Tùy chọn - bật nếu cần)
! ============================================================
! interface range GigabitEthernet1/0/2 - 24
!  switchport port-security
!  switchport port-security maximum 2
!  switchport port-security violation restrict
!  switchport port-security aging time 1440
!  switchport port-security aging type inactivity
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 exec-timeout 0 0
 password cisco123
 login local
 transport input ssh
!
end

!
! LƯU Ý TRIỂN KHAI:
! 1. CN1: VLAN 10,20,30,40
! 2. CN2: VLAN 110,120,140
! 3. Trunk allowed vlan phải khớp với L3 switch
! 4. Mỗi chi nhánh có 2 L2 switch (tầng 1, tầng 2) - stack hoặc uplink riêng
! 5. Port security: bật sau khi ổn định, tránh lock port khi test
!