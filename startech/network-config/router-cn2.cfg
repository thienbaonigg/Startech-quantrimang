!
! STARTECH - Router Chi nhánh 2 (R-CN2)
! Cisco IOSv 15.9(3)M - Config cho GNS3
!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R-CN2
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
no ipv6 cef
!
ip domain name startech.local
ip name-server 192.168.10.11
ip name-server 192.168.110.11
!
subscriber templating
!
multilink bundle-name authenticated
!
cts logging verbose
!
license udi pid ISR4331/K9 sn FDO87654321
!
spanning-tree extend system-id
!
vlan internal allocation policy ascending
!
redundancy
 mode none
!
interface GigabitEthernet0/0
 description *** WAN - Connect to Firewall/Internet ***
 ip address dhcp
 negotiation auto
 no mop enabled
 no mop sysid
!
interface GigabitEthernet0/1
 description *** Trunk to L3-SW-CN2 ***
 no ip address
 negotiation auto
!
interface GigabitEthernet0/1.110
 description *** VLAN 110 - Server/Mgmt CN2 ***
 encapsulation dot1Q 110
 ip address 192.168.110.1 255.255.255.0
 ip helper-address 192.168.10.12
!
interface GigabitEthernet0/1.120
 description *** VLAN 120 - Sales/CS CN2 ***
 encapsulation dot1Q 120
 ip address 192.168.120.1 255.255.255.0
 ip helper-address 192.168.10.12
!
interface GigabitEthernet0/1.140
 description *** VLAN 140 - Guest WiFi CN2 ***
 encapsulation dot1Q 140
 ip address 192.168.140.1 255.255.255.0
 ip helper-address 192.168.10.12
!
interface GigabitEthernet0/2
 description *** WAN Link to R-CN1 (10.0.0.0/30) ***
 ip address 10.0.0.2 255.255.255.252
 negotiation auto
!
router ospf 1
 router-id 2.2.2.2
 network 192.168.110.0 0.0.0.255 area 0
 network 192.168.120.0 0.0.0.255 area 0
 network 192.168.140.0 0.0.0.255 area 0
 network 10.0.0.0 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/0
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
line aux 0
line vty 0 4
 exec-timeout 0 0
 password cisco123
 login local
 transport input ssh
!
end