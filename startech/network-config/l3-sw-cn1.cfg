!
! STARTECH - L3 Switch Chi nhánh 1 (L3-SW-CN1)
! Cisco IOSvL2 / Catalyst 3650 - Config cho GNS3
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname L3-SW-CN1
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip routing
ip cef
!
ip domain name startech.local
ip name-server 192.168.10.11
ip name-server 192.168.110.11
!
vtp domain STARTECH
vtp mode transparent
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40 priority 0
!
vlan internal allocation policy ascending
!
redundancy
 mode sso
!
interface GigabitEthernet1/0/1
 description *** Uplink to R-CN1 (Trunk) ***
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 spanning-tree portfast trunk
!
interface GigabitEthernet1/0/2
 description *** Downlink to L2-SW-CN1-1 (Trunk) ***
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 spanning-tree portfast trunk
!
interface GigabitEthernet1/0/3
 description *** Downlink to L2-SW-CN1-2 (Trunk) ***
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 spanning-tree portfast trunk
!
interface GigabitEthernet1/0/4
 description *** Server01 - DC1/DNS ***
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 authentication port-control auto
 dot1x pae authenticator
!
interface GigabitEthernet1/0/5
 description *** Server02 - File/Web/DHCP/Chatbot ***
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 authentication port-control auto
 dot1x pae authenticator
!
interface GigabitEthernet1/0/6
 description *** WiFi AP CN1 (Guest) ***
 switchport access vlan 40
 switchport mode access
 spanning-tree portfast
!
interface Vlan10
 description *** SVI VLAN 10 - Server/Mgmt CN1 ***
 ip address 192.168.10.2 255.255.255.0
 ip helper-address 192.168.10.12
 no shutdown
!
interface Vlan20
 description *** SVI VLAN 20 - Sales CN1 ***
 ip address 192.168.20.2 255.255.255.0
 ip helper-address 192.168.10.12
 no shutdown
!
interface Vlan30
 description *** SVI VLAN 30 - Acct/HR CN1 ***
 ip address 192.168.30.2 255.255.255.0
 ip helper-address 192.168.10.12
 no shutdown
!
interface Vlan40
 description *** SVI VLAN 40 - Guest WiFi CN1 ***
 ip address 192.168.40.2 255.255.255.0
 ip helper-address 192.168.10.12
 no shutdown
!
router ospf 1
 router-id 10.10.10.1
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
 passive-interface Vlan40
!
ip forward-protocol nd
!
no ip http server
ip http secure-server
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 exec-timeout 0 0
 password cisco123
 login local
 transport input ssh
!
end